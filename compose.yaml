services:
  postgres:
    image: postgres:16-alpine
    container_name: groupbuy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-groupbuy_db}
      POSTGRES_USER: ${DB_USER:-groupbuy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-groupbuy_secure_password_replace_in_prod}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-groupbuy_user} -d ${DB_NAME:-groupbuy_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - groupbuy-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: groupbuy-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-groupbuy_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-groupbuy_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-groupbuy_secure_password_replace_in_prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - groupbuy-network

volumes:
  postgres_data:
    name: groupbuy-postgres-data

networks:
  groupbuy-network:
    name: groupbuy-network
    driver: bridge
