server:
  port: 0

spring:
  application:
    name: groupbuy-backend-test

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST
    allowed-headers: "*"
    allow-credentials: false
  payment:
    webhook-secret: ${APP_PAYMENT_WEBHOOK_SECRET:groupbuy-webhook-mock-secret}
